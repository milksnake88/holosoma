# Alice5 configuration values, consumed by config_types/robot.py and config_types/data_type.py.
#
# Every *.yaml in this directory is loaded once at import time (see
# robot.py::_load_robot_yaml_configs). Edit this file instead of the Python modules when
# tuning alice5 — no code change is needed.
robot_type: alice5

# robot.py: _ROBOT_DEFAULTS entry.
robot_defaults:
  robot_dof: 23
  robot_height: 1.65
  object_name: ground

# robot.py: RobotConfig.FOOT_STICKING_LINKS — links held fixed by the foot-sticking constraint.
foot_sticking_links:
  - left_foot_corner_fl
  - right_foot_corner_fl
  - left_foot_corner_fr
  - right_foot_corner_fr
  - left_foot_corner_bl
  - right_foot_corner_bl
  - left_foot_corner_br
  - right_foot_corner_br

# robot.py: RobotConfig.SELF_COLLISION — retargeter.py::SelfCollisionConfig fields, 1:1.
# Used only when RetargeterConfig.self_collision leaves `pairs` empty (see
# interaction_mesh_retargeter.py::_init_self_collision), so a CLI/code-level config still wins.
self_collision:
  enable: True

  # 두 링크가 최소한으로 유지해야 할 거리(미터). 만들어진 제약이 지켜내야 할 목표 간격을 말함.
  tolerance: 0.03 # 종아리가 스치면 0.03 -> 0.04 -> 0.05 정도로 조금씩 올리면서 중단이 나지 않는 상한을 찾는 게 안전

  # Body name pairs. Every body below carries exactly one collision geom, so this is
  # 11 geom pairs. Wrist pairs are intentionally absent: left/right_virtual_wrist_link are
  # empty IK frames with no geom, and the elbow geom already spans past the wrist anyway.
  pairs:
    # Legs — the calves (stl_ankle) crossing is the case this was added for.
    - [left_stl_ankle, right_stl_ankle]
    - [left_stl_thigh, right_stl_thigh]
    - [left_stl_thigh, right_stl_ankle]
    - [right_stl_thigh, left_stl_ankle]
    - [left_ankle_roll, right_ankle_roll]
    - [left_stl_ankle, right_ankle_roll]
    - [right_stl_ankle, left_ankle_roll]
    # Arm swing brushing the pelvis / same-side thigh while walking.
    - [left_elbow_pitch_link, pelvis]
    - [right_elbow_pitch_link, pelvis]
    - [left_elbow_pitch_link, left_stl_thigh]
    - [right_elbow_pitch_link, right_stl_thigh]

# robot.py: RobotConfig.MANUAL_COST — joint index -> cost weight.
# Ankles only: penalizes ankle_p jitter and ankle_r walking on the foot edge.
manual_cost:
  "22": 0.5 # l_ankle_p
  "23": 0.5 # l_ankle_r
  "28": 0.5 # r_ankle_p
  "29": 0.5 # r_ankle_r
# Previously tried (kept for reference):
# "7": 0.3 # waist_p
# "8": 0.2 # waist_r
# "9": 0.2 # waist_y
# "10": 1.0 # head_y
# "11": 1.0 # head_p
# "23": 0.1
# "29": 0.1

# data_type.py: JOINTS_MAPPINGS — human joint name -> alice5 link name, per motion data format.
joints_mapping:
  lafan: &lafan_mapping
    Hips: pelvis
    Spine1: waist_yaw_link
    LeftUpLeg: left_hip_roll_link
    RightUpLeg: right_hip_roll_link
    LeftLeg: left_stl_ankle
    RightLeg: right_stl_ankle
    LeftArm: left_shoulder_roll_link
    RightArm: right_shoulder_roll_link
    LeftForeArm: left_elbow_pitch_link
    RightForeArm: right_elbow_pitch_link
    LeftFoot: left_ankle_roll
    RightFoot: right_ankle_roll
    LeftToeBase: left_foot_toe
    RightToeBase: right_foot_toe
    LeftHand: left_virtual_wrist_link
    RightHand: right_virtual_wrist_link

  # SFU uses the same joint names as LAFAN for every mapped joint.
  sfu: *lafan_mapping

  # bones. BONES_DEMO_JOINTS (data_type.py) already renames the bones BVH bones to the LAFAN
  # vocabulary, so only the waist differs from *lafan_mapping: Spine2 (= bones "Chest") sits
  # 0.195 m above the hips, which scales to 0.188 m at alice5 height (1.65/1.70) and is the
  # closest match to alice5's 0.193 m pelvis-to-waist offset. The lower spine joints fall short
  # (Spine1 = bones "Spine2" -> 0.117 m, Spine = bones "Spine1" -> 0.048 m).
  bones:
    Hips: pelvis
    Spine2: waist_yaw_link
    LeftUpLeg: left_hip_roll_link
    RightUpLeg: right_hip_roll_link
    LeftLeg: left_stl_ankle
    RightLeg: right_stl_ankle
    LeftArm: left_shoulder_roll_link
    RightArm: right_shoulder_roll_link
    LeftForeArm: left_elbow_pitch_link
    RightForeArm: right_elbow_pitch_link
    LeftFoot: left_ankle_roll
    RightFoot: right_ankle_roll
    LeftToeBase: left_foot_toe
    RightToeBase: right_foot_toe
    LeftHand: left_virtual_wrist_link
    RightHand: right_virtual_wrist_link

  # Same robot links as lafan. Spine2 drives waist_yaw_link: alice5 puts the waist
  # 0.193 m above the pelvis and, once scaled to robot height, SMPL-X Spine2 is the spine joint
  # that lands closest to it (Spine1 falls ~8 cm short, Spine3 overshoots ~13 cm). Retargeting
  # 4 ACCAD walk clips with Spine1/Spine2/Spine3 gave near-identical joint error (7.8-8.1 cm),
  # but Spine2 had the least toe sliding in every clip.
  smplx:
    Pelvis: pelvis
    Spine2: waist_yaw_link
    L_Hip: left_hip_roll_link
    R_Hip: right_hip_roll_link
    L_Knee: left_stl_ankle
    R_Knee: right_stl_ankle
    L_Shoulder: left_shoulder_roll_link
    R_Shoulder: right_shoulder_roll_link
    L_Elbow: left_elbow_pitch_link
    R_Elbow: right_elbow_pitch_link
    L_Ankle: left_ankle_roll
    R_Ankle: right_ankle_roll
    L_Foot: left_foot_toe
    R_Foot: right_foot_toe
    L_Wrist: left_virtual_wrist_link
    R_Wrist: right_virtual_wrist_link
